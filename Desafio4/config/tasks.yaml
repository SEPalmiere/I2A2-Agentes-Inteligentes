       - Resumo executivo em PDF (se aplicável)
    
    EMAIL PARA RH INTERNO:
    1. DESTINATÁRIO: drpalmiere@gmail.com
    2. ASSUNTO: "Compra realizada com Sucesso"
    3. CONTEÚDO OBRIGATÓRIO:
       - Confirmação de conclusão do processo
       - Competência processada e data/hora de conclusão
       - Métricas principais: colaboradores, valores, distribuição
       - Status do envio para fornecedor (confirmado/pendente)
